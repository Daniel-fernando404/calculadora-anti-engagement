<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anti-Engaños</title>

    <!--CSS-->
    <link rel="stylesheet" href="../styles/styles.css">
    <!--FUENTE-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <!-- CABEZERA DE LA PÁGINA -->
    <header>
        <h1 class="titulo-principal">
            ANTI-ENGAÑOS
        </h1>
        <!-- BARRA DE NAVEGACIÓN -->
        <nav class="barra-nav">
            <ul>
                <li><a href="#">Comparar</a></li>
                <li><a href="#">Historial</a></li>
            </ul>
            <div class="ajustes">
                <a href="#">ajustes</a>
            </div>
        </nav>
    </header>
    <main>
        <!-- SECCIÓN PRINCIPAL DE LA PÁGINA -->
        <section class="comparadores">

            <article class="opcionA">
                <h2>Opcion por Unidad</h2>
                <div class="tarjeta-a">
                    <label for="precio-a">Precio ($)</label>
                    <input type="number" id="precio-a">
                    <label for="cantidad-a">Cantidad (U, G, ML)</label>
                    <input type="number" id="cantidad-a">
                    <select id="selector-a">
                        <option value="unidades">Unidades (U)</option>
                        <option value="gramos">Gramos (G)</option>
                        <option value="mililitros">Mililitros (ML)</option>
                    </select>
                    <div class="precio-unitario-a">
                        <h3>
                            Precio Unitario: $0.00
                        </h3>
                    </div>
                </div>
    
            </article>
            <article class="opcionB">
                <h2>Opcion por Packs</h2>
                <div class="tarjeta-b">
                    <label for="precio-b">Precio ($)</label>
                    <input type="number" id="precio-b">
                    <label for="cantidad-b">Cantidad (U, G, ML)</label>
                    <input type="number" id="cantidad-b">
                    <select id="selector-b">
                        <option value="unidades">Unidades (U)</option>
                        <option value="gramos">Gramos (G)</option>
                        <option value="mililitros">Mililitros (ML)</option>
                    </select>
                    <div class="precio-unitario-b">
                        <h3>
                            Precio Unitario: $0.00
                        </h3>
                    </div>
                </div>
            </article>
        </section>
        <!-- SECCIÓN DECORATIVA -->
        <div class="text-decorativo">
            <p>
                Compara precios de productos por unidad o por packs y descubre cuál es la mejor opción para tu bolsillo.
            </p>
            
        </div>
    </main>
    <!-- PIE DE PÁGINA -->
    <footer>
        <small>Copyright © 2024 Anti-Engaños. All rights reserved.</small>
    </footer>
</body>
</html>
